# Device profiles for Panel PDF mode. Add or edit entries freely (or use the
# app's "Edit devices..." UI).
#
#   width/height  panel native resolution in portrait (pixels). The PDF page
#                 is sized width x height points so pages fill the screen.
#   orientation   "portrait" or "landscape". Landscape swaps width/height so
#                 pages are laid out sideways.
#
# "default" is the device pre-selected in the interactive menu.
#
# font_size is a general setting (not per-device): the PDF default font
# size Calibre uses when converting ebooks.

default = "kpw11"
font_size = 120

# Fonts used when converting ebooks to PDF. Calibre looks these up by
# family name on macOS.
# Alternatives: Yu Mincho, Yu Gothic, Noto Serif/Sans CJK JP.

[fonts.macos]
serif = "Hiragino Mincho ProN"
sans = "Hiragino Sans"
mono = "Menlo"

[devices.kpw11]
label = "Kindle Paperwhite 11th"  # 6.8", 300 PPI
width = 1236
height = 1648
orientation = "landscape"

[devices.rp1]
label = "Sony DPT-RP1"       # 13.3", ~207 PPI
width = 1650
height = 2200
orientation = "portrait"
