name: Release desktop app

# Trigger: git push origin v0.1.0  (tag must match v*.*.*)
# Result: GitHub Release with a universal (arm64 + x86_64) Cookbook.dmg.
# Install via install.sh (unsigned).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Cookbook.app and disk image
        run: macos/scripts/build-app.sh

      - name: Confirm universal binary
        run: |
          BIN="dist/Cookbook.app/Contents/MacOS/Cookbook"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          draft: false
