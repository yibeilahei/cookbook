name: Release desktop app

# Trigger: git push origin v0.1.0  (tag must match v*.*.*)
# Result: GitHub Release with Cookbook.dmg. Install via install.sh (unsigned).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Cookbook.app and disk image
        run: macos/scripts/build-app.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          draft: false
