# Device profiles for .xtch mode. Add or edit entries freely (or use the
# app's "Edit devices..." UI).
#
#   width/height  panel native resolution in portrait (pixels). The PDF page
#                 is sized width x height points so pages fill the screen.
#   supersample   rasterization multiplier used before downscaling the page
#                 to the panel's pixel size (higher = sharper text/images,
#                 slower to convert). Not the panel's physical PPI.
#   orientation   "portrait" or "landscape". Landscape swaps width/height so
#                 pages are laid out sideways.
#
# "default" is the device pre-selected in the interactive menu.
#
# font_size is a general setting (not per-device): the PDF default font
# size Calibre uses when converting ebooks.
#
# ascii_romanization controls how CJK in .xtch filenames and chapter names
# is transliterated to ASCII (every language always gets a plain Unidecode
# ASCII fallback regardless -- this only picks a higher-quality pre-pass):
#   japanese (default)  Hepburn romaji
#   chinese             pinyin (used for both Simplified and Traditional)
#   korean              hangul (Revised Romanization)
#   none                skip the pre-pass (plain Unidecode fallback only)
# Aliases: ja/jp, zh/cn, ko/kr, off/no (for none).
#
# page_compression stores each XTH page as raw-DEFLATE when that shrinks it.
# Off by default: currently the only firmware that supports page compression
# is lazahata. Other firmware will fail to open compressed books.

default = "x3"
ascii_romanization = "japanese"
page_compression = false
font_size = 60

# Fonts used when converting ebooks to PDF. Calibre looks these up by
# family name on macOS.
# Alternatives: Yu Mincho, Yu Gothic, Noto Serif/Sans CJK JP.

[fonts.macos]
serif = "Hiragino Mincho ProN"
sans = "Hiragino Sans"
mono = "Menlo"

[devices.x3]
label = "Xteink X3"          # 3.7", ~250 PPI
width = 528
height = 792
supersample = 3
orientation = "portrait"

[devices.x4]
label = "Xteink X4"          # 4.3", ~218 PPI
width = 480
height = 800
supersample = 3
orientation = "portrait"
