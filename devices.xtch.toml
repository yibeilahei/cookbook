# Device profiles for toxtch.py. Add or edit entries freely.
#
#   width/height  panel native resolution in portrait (pixels). The PDF page
#                 is sized width x height points so pages fill the screen.
#   dpi           rasterization DPI before fitting the page to the panel.
#   orientation   "portrait" or "landscape". Landscape swaps width/height so
#                 pages are laid out sideways.
#   font_size     PDF default font size for this device (ebooks only).
#
# "default" is the device pre-selected in the interactive menu.
#
# cjk_language romanizes CJK in .xtch filenames and chapter names:
#   japanese (default)  Hepburn romaji
#   chinese             pinyin
#   korean              hangul (Revised Romanization)
# Aliases: ja/jp, zh/cn, ko/kr.

default = "x3"
cjk_language = "japanese"

# CJK fonts used when converting ebooks to PDF. Calibre looks these up by
# family name on the local OS, so each platform has its own table.
# Windows: Yu Mincho / Yu Gothic ship with the Japanese language pack.
# Alternatives: MS Mincho, MS Gothic, Meiryo, Noto Serif/Sans CJK JP.

[fonts.macos]
serif = "Hiragino Mincho ProN"
sans = "Hiragino Sans"
mono = "Menlo"

[fonts.windows]
serif = "Yu Mincho"
sans = "Yu Gothic"
mono = "Consolas"

[devices.x3]
label = "Xteink X3"          # 3.7", ~250 PPI
width = 528
height = 792
dpi = 200
orientation = "portrait"
font_size = 62

[devices.x4]
label = "Xteink X4"          # 4.3", ~218 PPI
width = 480
height = 800
dpi = 200
orientation = "portrait"
font_size = 62
